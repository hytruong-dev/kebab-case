        <div id="cap-11" class="cap clip" data-start="17.406" data-duration="1.169" data-track-index="0"><span id="cap-t-11" class="cap-t" style="rotate: 0.6deg">Chỉ còn một ngọn đèn sạch</span></div>

        <div id="cap-17" class="cap clip" data-start="27.627" data-duration="1.641" data-track-index="0"><span id="cap-t-17" class="cap-t" style="rotate: 0.6deg">Eilean Mòr, nghĩa là &quot;Đảo Lớn&quot;,</span></div>

        <div id="cap-20" class="cap clip" data-start="32.58" data-duration="1.07" data-track-index="0"><span id="cap-t-20" class="cap-t" style="rotate: 0.6deg">Quanh đảo là vách đá</span></div>

        <div id="cap-23" class="cap clip" data-start="36.302" data-duration="1.396" data-track-index="0"><span id="cap-t-23" class="cap-t" style="rotate: 0.6deg">Mọi viên đá, mọi thùng dầu để</span></div>

        <div id="cap-39" class="cap clip" data-start="64.191" data-duration="2.12" data-track-index="0"><span id="cap-t-39" class="cap-t" style="rotate: -0.6deg">Theo lịch, tàu tiếp tế Hesperus phải</span></div>

        <div id="cap-72" class="cap clip" data-start="115.643" data-duration="1.696" data-track-index="0"><span id="cap-t-72" class="cap-t" style="rotate: -0.6deg">Bến phía đông vẫn nguyên vẹn. Nhưng</span></div>

        <div id="cap-90" class="cap clip" data-start="141.858" data-duration="1.338" data-track-index="0"><span id="cap-t-90" class="cap-t" style="rotate: -0.6deg">Có người nói một con rắn biển</span></div>
        <div id="cap-91" class="cap clip" data-start="143.196" data-duration="1.062" data-track-index="0"><span id="cap-t-91" class="cap-t" style="rotate: 0deg">khổng lồ đã mang họ đi.</span></div>
        <div id="cap-92" class="cap clip" data-start="144.608" data-duration="1.2" data-track-index="0"><span id="cap-t-92" class="cap-t" style="rotate: 0.6deg">Có người cho rằng họ bị bắt</span></div>
        <div id="cap-93" class="cap clip" data-start="145.808" data-duration="1.289" data-track-index="0"><span id="cap-t-93" class="cap-t" style="rotate: -0.6deg">cóc, hoặc tự trốn lên một con</span></div>
        <div id="cap-94" class="cap clip" data-start="147.096" data-duration="1.2" data-track-index="0"><span id="cap-t-94" class="cap-t" style="rotate: 0deg">tàu lạ để làm lại cuộc đời.</span></div>
        <div id="cap-95" class="cap clip" data-start="148.647" data-duration="1.065" data-track-index="0"><span id="cap-t-95" class="cap-t" style="rotate: 0.6deg">Dân địa phương thì kể về</span></div>
        <div id="cap-96" class="cap clip" data-start="149.712" data-duration="1.154" data-track-index="0"><span id="cap-t-96" class="cap-t" style="rotate: -0.6deg">&quot;Bóng Ma Bảy Thợ Săn&quot;, con</span></div>
        <div id="cap-97" class="cap clip" data-start="150.866" data-duration="1.243" data-track-index="0"><span id="cap-t-97" class="cap-t" style="rotate: 0deg">thuyền ma của vùng biển này.</span></div>
        <div id="cap-98" class="cap clip" data-start="152.459" data-duration="1.893" data-track-index="0"><span id="cap-t-98" class="cap-t" style="rotate: 0.6deg">Năm 1912, một bài thơ nổi tiếng</span></div>
        <div id="cap-99" class="cap clip" data-start="154.352" data-duration="1.343" data-track-index="0"><span id="cap-t-99" class="cap-t" style="rotate: -0.6deg">còn tả chiếc ghế đổ và</span></div>
        <div id="cap-100" class="cap clip" data-start="155.695" data-duration="1.648" data-track-index="0"><span id="cap-t-100" class="cap-t" style="rotate: 0deg">bữa ăn còn nguyên trên bàn.</span></div>
        <div id="cap-101" class="cap clip" data-start="157.693" data-duration="1.535" data-track-index="0"><span id="cap-t-101" class="cap-t" style="rotate: 0.6deg">Nhưng chính Joseph Moore đã khai:</span></div>
        <div id="cap-102" class="cap clip" data-start="159.228" data-duration="1.07" data-track-index="0"><span id="cap-t-102" class="cap-t" style="rotate: -0.6deg">bếp rất sạch, bữa ăn đã</span></div>
        <div id="cap-103" class="cap clip" data-start="160.297" data-duration="1.023" data-track-index="0"><span id="cap-t-103" class="cap-t" style="rotate: 0deg">xong từ lâu. Chiếc ghế</span></div>
        <div id="cap-104" class="cap clip" data-start="161.32" data-duration="0.93" data-track-index="0"><span id="cap-t-104" class="cap-t" style="rotate: 0.6deg">đổ chỉ có trong thơ.</span></div>
        <div id="cap-105" class="cap clip" data-start="162.6" data-duration="1.489" data-track-index="0"><span id="cap-t-105" class="cap-t" style="rotate: -0.6deg">Còn những trang nhật ký rùng rợn</span></div>
        <div id="cap-106" class="cap clip" data-start="164.089" data-duration="1.349" data-track-index="0"><span id="cap-t-106" class="cap-t" style="rotate: 0deg">kể rằng 3 người khóc lóc, cầu</span></div>
        <div id="cap-107" class="cap clip" data-start="165.438" data-duration="1.256" data-track-index="0"><span id="cap-t-107" class="cap-t" style="rotate: 0.6deg">nguyện giữa bão, sau này đã</span></div>
        <div id="cap-108" class="cap clip" data-start="166.695" data-duration="1.163" data-track-index="0"><span id="cap-t-108" class="cap-t" style="rotate: -0.6deg">bị chứng minh là bịa đặt.</span></div>
        <div id="cap-109" class="cap clip" data-start="170.408" data-duration="1.35" data-track-index="0"><span id="cap-t-109" class="cap-t" style="rotate: 0deg">Vậy chuyện gì đã thật sự</span></div>
        <div id="cap-110" class="cap clip" data-start="171.758" data-duration="1.575" data-track-index="0"><span id="cap-t-110" class="cap-t" style="rotate: 0.6deg">xảy ra? Giám sát viên Robert</span></div>
        <div id="cap-111" class="cap clip" data-start="173.332" data-duration="1.856" data-track-index="0"><span id="cap-t-111" class="cap-t" style="rotate: -0.6deg">Muirhead, người từng tuyển cả ba,</span></div>
        <div id="cap-112" class="cap clip" data-start="175.188" data-duration="1.518" data-track-index="0"><span id="cap-t-112" class="cap-t" style="rotate: 0deg">ra đảo điều tra ngày 29/12.</span></div>
        <div id="cap-113" class="cap clip" data-start="177.056" data-duration="1.869" data-track-index="0"><span id="cap-t-113" class="cap-t" style="rotate: 0.6deg">Ông kết luận: chiều thứ Bảy 15/12,</span></div>
        <div id="cap-114" class="cap clip" data-start="178.925" data-duration="1.979" data-track-index="0"><span id="cap-t-114" class="cap-t" style="rotate: -0.6deg">Ducat và Marshall xuống bến phía tây</span></div>
        <div id="cap-115" class="cap clip" data-start="180.903" data-duration="1.539" data-track-index="0"><span id="cap-t-115" class="cap-t" style="rotate: 0deg">để buộc lại thùng dây thừng.</span></div>
        <div id="cap-116" class="cap clip" data-start="182.791" data-duration="1.53" data-track-index="0"><span id="cap-t-116" class="cap-t" style="rotate: 0.6deg">Marshall từng bị phạt 5 shilling</span></div>
        <div id="cap-117" class="cap clip" data-start="184.321" data-duration="1.004" data-track-index="0"><span id="cap-t-117" class="cap-t" style="rotate: -0.6deg">vì để bão cuốn mất đồ</span></div>
        <div id="cap-118" class="cap clip" data-start="185.325" data-duration="1.148" data-track-index="0"><span id="cap-t-118" class="cap-t" style="rotate: 0deg">nghề. Lần này, có lẽ anh</span></div>
        <div id="cap-119" class="cap clip" data-start="186.473" data-duration="1.339" data-track-index="0"><span id="cap-t-119" class="cap-t" style="rotate: 0.6deg">không muốn mất thêm lần nữa.</span></div>
        <div id="cap-120" class="cap clip" data-start="188.162" data-duration="1.265" data-track-index="0"><span id="cap-t-120" class="cap-t" style="rotate: -0.6deg">Bờ đá ở đây bị khoét thành</span></div>
        <div id="cap-121" class="cap clip" data-start="189.427" data-duration="1.265" data-track-index="0"><span id="cap-t-121" class="cap-t" style="rotate: 0deg">những khe hẹp và hang sâu.</span></div>
        <div id="cap-122" class="cap clip" data-start="190.693" data-duration="1.217" data-track-index="0"><span id="cap-t-122" class="cap-t" style="rotate: 0.6deg">Khi sóng lớn ập vào, nước</span></div>
        <div id="cap-123" class="cap clip" data-start="191.91" data-duration="1.217" data-track-index="0"><span id="cap-t-123" class="cap-t" style="rotate: -0.6deg">bị nén lại rồi phụt ngược</span></div>
        <div id="cap-124" class="cap clip" data-start="193.126" data-duration="1.363" data-track-index="0"><span id="cap-t-124" class="cap-t" style="rotate: 0deg">lên thành cột nước khổng lồ.</span></div>
        <div id="cap-125" class="cap clip" data-start="194.839" data-duration="1.089" data-track-index="0"><span id="cap-t-125" class="cap-t" style="rotate: 0.6deg">Một con sóng như thế đã</span></div>
        <div id="cap-126" class="cap clip" data-start="195.928" data-duration="1.184" data-track-index="0"><span id="cap-t-126" class="cap-t" style="rotate: -0.6deg">vươn cao hơn chỗ họ đứng,</span></div>
        <div id="cap-127" class="cap clip" data-start="197.112" data-duration="0.994" data-track-index="0"><span id="cap-t-127" class="cap-t" style="rotate: 0deg">rồi đổ ập xuống, cuốn</span></div>
        <div id="cap-128" class="cap clip" data-start="198.107" data-duration="0.994" data-track-index="0"><span id="cap-t-128" class="cap-t" style="rotate: 0.6deg">cả hai người ra biển.</span></div>
        <div id="cap-129" class="cap clip" data-start="199.451" data-duration="1.703" data-track-index="0"><span id="cap-t-129" class="cap-t" style="rotate: -0.6deg">Còn McArthur, người phải ở lại trông</span></div>
        <div id="cap-130" class="cap clip" data-start="201.154" data-duration="1.135" data-track-index="0"><span id="cap-t-130" class="cap-t" style="rotate: 0deg">đèn, có lẽ đã thấy những</span></div>
        <div id="cap-131" class="cap clip" data-start="202.29" data-duration="1.135" data-track-index="0"><span id="cap-t-131" class="cap-t" style="rotate: 0.6deg">con sóng từ trên cao, và</span></div>
        <div id="cap-132" class="cap clip" data-start="203.425" data-duration="1.277" data-track-index="0"><span id="cap-t-132" class="cap-t" style="rotate: -0.6deg">lao xuống, không kịp mặc áo</span></div>
        <div id="cap-133" class="cap clip" data-start="204.702" data-duration="1.183" data-track-index="0"><span id="cap-t-133" class="cap-t" style="rotate: 0deg">mưa, để báo cho đồng đội.</span></div>
        <div id="cap-134" class="cap clip" data-start="206.236" data-duration="1.485" data-track-index="0"><span id="cap-t-134" class="cap-t" style="rotate: 0.6deg">Và anh cũng không bao giờ trở về.</span></div>
        <div id="cap-135" class="cap clip" data-start="208.071" data-duration="1.544" data-track-index="0"><span id="cap-t-135" class="cap-t" style="rotate: -0.6deg">Không thi thể nào được tìm thấy.</span></div>
        <div id="cap-136" class="cap clip" data-start="209.615" data-duration="1.206" data-track-index="0"><span id="cap-t-136" class="cap-t" style="rotate: 0deg">Ducat để lại vợ và 4 con,</span></div>
        <div id="cap-137" class="cap clip" data-start="210.822" data-duration="1.351" data-track-index="0"><span id="cap-t-137" class="cap-t" style="rotate: 0.6deg">McArthur để lại vợ và 2 con.</span></div>
        <div id="cap-138" class="cap clip" data-start="212.523" data-duration="1.976" data-track-index="0"><span id="cap-t-138" class="cap-t" style="rotate: -0.6deg">Năm 1971, ngọn hải đăng được tự</span></div>
        <div id="cap-139" class="cap clip" data-start="214.499" data-duration="1.657" data-track-index="0"><span id="cap-t-139" class="cap-t" style="rotate: 0deg">động hóa. Từ đó, không còn</span></div>
        <div id="cap-140" class="cap clip" data-start="216.156" data-duration="1.657" data-track-index="0"><span id="cap-t-140" class="cap-t" style="rotate: 0.6deg">ai phải sống trên đảo nữa.</span></div>
        <div id="cap-141" class="cap clip" data-start="218.163" data-duration="1.714" data-track-index="0"><span id="cap-t-141" class="cap-t" style="rotate: -0.6deg">Nhưng mỗi đêm, đèn trên Eilean Mòr</span></div>
        <div id="cap-142" class="cap clip" data-start="219.877" data-duration="1.311" data-track-index="0"><span id="cap-t-142" class="cap-t" style="rotate: 0deg">vẫn chớp sáng 2 lần mỗi 30</span></div>
        <div id="cap-143" class="cap clip" data-start="221.188" data-duration="1.462" data-track-index="0"><span id="cap-t-143" class="cap-t" style="rotate: 0.6deg">giây, như lời nhắc về 3 người</span></div>
        <div id="cap-144" class="cap clip" data-start="222.651" data-duration="1.462" data-track-index="0"><span id="cap-t-144" class="cap-t" style="rotate: -0.6deg">gác đèn không bao giờ trở về.</span></div>
        <div id="cap-145" class="cap clip" data-start="224.463" data-duration="1.336" data-track-index="0"><span id="cap-t-145" class="cap-t" style="rotate: 0deg">Còn bạn, bạn tin vào con sóng</span></div>
        <div id="cap-146" class="cap clip" data-start="225.799" data-duration="1.428" data-track-index="0"><span id="cap-t-146" class="cap-t" style="rotate: 0.6deg">khổng lồ, hay nghĩ rằng vẫn còn</span></div>
        <div id="cap-147" class="cap clip" data-start="227.226" data-duration="1.29" data-track-index="0"><span id="cap-t-147" class="cap-t" style="rotate: -0.6deg">điều gì chưa được kể? Hãy để</span></div>
        <div id="cap-148" class="cap clip" data-start="228.516" data-duration="1.059" data-track-index="0"><span id="cap-t-148" class="cap-t" style="rotate: 0deg">lại ý kiến của bạn nhé.</span></div>
      </div>
